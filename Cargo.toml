[package]
name = "feedbinctl"
version = "0.1.2"
edition = "2024"
description = "Index and search Feedbin entries from the command line"
license = "MIT"
repository = "https://github.com/leoshimo/feedbinctl"
keywords = ["feedbin", "rss", "search", "sqlite"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
keyring = "2"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
rpassword = "7"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
wiremock = "0.5"
